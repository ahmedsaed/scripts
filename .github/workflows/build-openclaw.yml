name: Build OpenClaw Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenClaw version (e.g. 2026.6.8)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/ai-stack/openclaw
          push: true
          build-args: |
            OPENCLAW_IMAGE=ghcr.io/openclaw/openclaw:${{ inputs.version }}
          tags: |
            ghcr.io/ahmedsaed/openclaw:latest
            ghcr.io/ahmedsaed/openclaw:${{ inputs.version }}
