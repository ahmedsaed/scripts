services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ${HOME}/apps/ollama:/root/.ollama
      - ${HOME}/apps/llama_cpp:/llama_cpp
      - ./custom_models:/custom_models
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3002:8080"
    volumes:
      - /opt/ai-apps/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped

  openedai-speech:
      image: ghcr.io/matatonic/openedai-speech-min
      container_name: openedai-speech
      volumes:
        - ${HOME}/apps/openedai/voices:/app/voices
        - ${HOME}/apps/openedai/config:/app/config

networks:
  default:
    external: true
    name: main
